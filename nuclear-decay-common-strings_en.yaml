a11y:
  qualitative:
    positionAbove: above
    positionBelow: below
    positionEqualTo: equal to
    distanceSmall: small
    distanceMedium: medium
    distanceLarge: large
    distanceInfinite: infinite
    progressSmaller: smaller
    progressLarger: larger
    progressShorter: shorter
    progressLonger: longer
    progressLower: lower
    progressHigher: higher
    valueLow: Low
    valueMedium: Medium
    valueHigh: High
  energyDiagram:
    accessibleName: Energy Diagram
    accessibleHelpTextCollapsed: Show changes to alpha particle energy.
    staticDescription: >-
      An energy versus distance graph shows alpha particles in a nuclear potential well and indicates their
      energy before and after decay.
    beforeDecay:
      initialEnergy: 'Initial energy is { $position } potential energy barrier height.'
      escapeDistance: 'Alpha particle escape distance is { $distance }.'
    afterDecay:
      finalEnergy: 'Final energy lower.'
      escapeDistance: 'Alpha particle escape distance is { $distance }.'
      potentialWell: 'Potential well deeper.'
  energyDiagramSliders:
    accessibleContextResponse: 'Alpha particle escape distance { $distanceProgress }, half-life { $hLifeProgress }.'
  potentialEnergyBarrierHeight: Potential Energy Barrier Height
  potentialEnergySlider:
    accessibleHelpText: Adjust well height.
  initialEnergySlider:
    accessibleHelpText: Adjust initial energy for alpha particles in nucleus.
  decayTimeHistogram:
    accessibleParagraph: '{ $scale } timeline in seconds shows when each { $isotope } atom decayed relative to the half-life, { $hLifeTime } seconds.'
    scale:
      select_scale:
        linear: Linear
        logarithmic: Logarithmic
  halfLifeSlider:
    accessibleHelpText: Adjust time for isotope A to undergo one half-life.
    accessibleContextResponse: 'Initial energy { $initialEProgress }, alpha particle escape distance { $distanceProgress }.'
  dataProbeSlider:
    accessibleHelpText: Move probe horizontally to explore graph values.
  timeScaleCheckbox:
    accessibleHelpText: Show or hide time scale ranging from milliseconds to billions of years.
    accessibleContextResponseChecked: Time scale shown.
    accessibleContextResponseUnchecked: Time scale hidden.
  eraserButton:
    accessibleName: Erase Data
    accessibleContextResponse: Data points removed.
  isotopePanel:
    accessibleHelpText: Choose an isotope to explore its decay.
  particleCounts:
    accessibleName: Particle Counts
    accessibleHelpTextCollapsed: View numbers of protons and neutrons in current isotope.
    accessibleParagraph: '{ $isotope } contains { $protons } protons and { $neutrons } neutrons.'
    noData: No data to display.
  nuclearEquation:
    accessibleHelpTextCollapsed: Explore how mass number and charge are conserved in decay.
    noEquation: No equation yet.
    beforeDecay: '{ $parentIsotope } decays to a product and another product.'
    afterDecay: >-
      { $parentIsotope } decays to { $daughterIsotope } and an alpha particle. Original mass, { $parentMass } and
      product masses, { $daughterMass } and 4. Original charge, { $parentCharge } and product charges,
      {{daughterCharge}} and 2.
  timeControls:
    accessibleHeading: Time Controls
  replayDecay:
    accessibleName: Replay Decay
    accessibleHelpText: Restart time just before last decay.
  speedControls:
    accessibleHelpText: For closer observations play sim on slower speed.
  multipleAtoms:
    screenSummary:
      playArea: >-
        You can add atoms to a radioactive sample and watch them decay. As time passes, you can track how much
        remains and reset the sample to repeat your experiment. A timeline shows the moment of each decay
        relative to the half-life. With a custom isotope, you can also experiment with the half-life time.
      controlArea: >-
        Checkboxes let you show or hide the electron cloud and stopwatch. You can control how fast the action
        happens including buttons to pause and step forward. Reset sim to start over.
      currentDetails:
        select_atom:
          noAtoms: Currently, there are no atoms in sample.
          withAtoms: 'Currently { $percentage } percent radioactive sample remaining.'
      interactionHint:
        addAtoms: Add atoms to begin observations.
        afterDecay: Reset sample to continue observations.
    radioactiveSampleHeading: Radioactive Sample
    radioactiveSample:
      noAtoms: 'No atoms in sample. Look for { $isotope } atoms control to get started.'
      readyToDecay: 'Original sample contains { $addedAtoms } { $isotope } atoms, ready to decay.'
      decayOccurring: >-
        Original sample contains { $addedAtoms } { $isotope } atoms. { $decayParticle } particles are emitted from
        decaying atoms and move away. Currently, sample is { $time } seconds old and { $percentageUndecayed }
        percent remains. { $undecayedCount } { $isotope } atoms undecayed. { $decayedCount } { $isotope } atoms decayed.
    numberOfAtomsControl:
      accessibleName: '{ $isotope } Atoms'
    addAtomsButton:
      accessibleName: Add Atoms
    resetSampleButton:
      accessibleName: Reset Sample
    decayDataHeading: Decay Data
    decayTimeHistogramAtHalfLife: 'At half-life, { $halfLifePercentageUndecayed } percent of sample remains.'
    electronCloudCheckbox:
      accessibleName: Electron Cloud
      accessibleHelpText: Show or hide electron clouds for atoms.
    stopwatchCheckbox:
      accessibleName: Stopwatch
      accessibleHelpText: Show or hide stopwatch.
  decayRate:
    screenSummary:
      playArea: >-
        There is a radioactive sample where you can add atoms and watch them decay. As time passes, you can
        track how much remains and reset the sample to repeat your experiment. A decay graph plots the
        percentage of sample remaining as a function of time.
      controlArea: >-
        Checkboxes let you show or hide isotope curves, half-life markers, and a data probe on the decay
        graph. You can also control how fast the action happens including buttons to pause and step forward.
        Reset sim to start over.
      currentDetails:
        select_atom:
          noAtoms: Currently, there are no atoms in sample.
          withAtoms: 'Currently { $percentage } percent radioactive sample remaining.'
      interactionHint:
        addAtoms: Add atoms to begin observations.
        afterDecay: Reset sample to continue observations.
    radioactiveSample:
      decayOccurring: >-
        Original sample contains { $addedAtoms } { $isotope } atoms, decaying. Currently, sample is
        { $time } seconds old and { $percentageUndecayed } percent remains. { $undecayedCount } { $isotope }
        atoms. { $decayedCount } { $isotope } atoms.
    decayGraphHeading: Decay Graph
    decayGraphPanel:
      accessibleParagraph: 'Decay graph plots percent of isotope remaining as a function of time. Currently, { $checkedComponents } visible on graph.'
    undecayedCheckbox:
      accessibleName: '{ $isotope } Curve'
      accessibleHelpText: Show or hide decay curve.
    decayedCheckbox:
      accessibleName: '{ $isotope } Curve'
      accessibleHelpText: Show or hide formation curve.
    halfLivesCheckbox:
      accessibleName: Half-Lives
      accessibleHelpText: Explore decay graph with or without half-life markers.
    dataProbeCheckbox:
      accessibleName: Data Probe
      accessibleHelpText: Explore decay graph with or without values.
    sortButton:
      accessibleName: Sort
      accessibleHelpText: Group atoms by isotope.
    resetSampleButton:
      accessibleName: Reset Sample
a11y:
  qualitative:
    positionAbove: above
    positionBelow: below
    positionEqualTo: equal to
    equal: equal
    distanceSmall: small
    distanceMedium: medium
    distanceLarge: large
    distanceInfinite: infinite
    progressSmaller: smaller
    progressLarger: larger
    progressShorter: shorter
    progressLonger: longer
    progressLower: lower
    progressHigher: higher
    progressUnchanged: unchanged
    valueLow: Low
    valueMedium: Medium
    valueHigh: High
  scientificNotation: '{ $mantissa } times 10 to the { $exponent }'
  signSelector:
    select_sign:
      positive: '{ $value }'
      negative: 'negative { $value }'
  alphaDecay:
    screenSummary:
      playArea: >-
        A radioactive atom with jiggling nucleons sits in the center. You can watch it decay,
        observe how the nucleus changes, and reset the atom to repeat your experiment. A timeline shows the moment
        of each decay relative to half-life.
      energyGraph: >-
        An energy diagram shows the potential energy barrier and alpha particle
        energy. With a custom isotope, you can experiment with the barrier height, alpha particle energy, and half-life.
      playAreaSelector:
        select_quantum:
          true: '{ a11y.alphaDecay.screenSummary.playArea } { a11y.alphaDecay.screenSummary.energyGraph }'
          false: '{ a11y.alphaDecay.screenSummary.playArea }'
      controlArea: >-
        You can replay the last decay and control how fast the action happens. Reset sim to
        start over.
      currentDetails:
        select_atom:
          noAtom: Currently no atom in play area.
          withAtom: 'Currently { $isotope } atom in play area.'
      interactionHint:
        addAtom: Add atom to begin observations.
        afterDecay: Reset atom to continue observations.
    radioactiveAtomHeading: Radioactive Atom
    addAtomButton:
      accessibleContextResponse: '{ $isotope } added.'
    atomInPlayArea:
      readyToDecay: '{ $isotope } present, ready to decay.'
      nowPresent: '{ $isotope } now present. Decay time, { $decayTime } seconds.'
    atomDecay:
      alphaParticleEmitted: 'Alpha particle emitted from nucleus. Decay time, { $decayTime } seconds.'
    resetAtomButton:
      accessibleName: Reset Atom
      accessibleContextResponse: Nucleus reset.
    decayDataHeading: Decay Data
    multipleAtomsScreen:
      decayParticle: Alpha
  energyDiagram:
    accessibleName: Energy Diagram
    accessibleHelpTextCollapsed: View alpha particle in nuclear potential well.
    staticDescription: >-
      An energy versus distance graph shows a nuclear potential well.
    beforeDecay:
      leadingParagraph: 'Before decay:'
      alphaParticleInWell: 'Single alpha particle in well moves along its energy line, { $position } potential energy barrier height.'
      escapeDistance: 'Alpha particle escape distance is { $distance }.'
      escapeDistanceDescription: Escape distance is where alpha particle energy meets the barrier.
    afterDecay:
      accessibleParagraph: After decay, well is deeper and empty.
  escapeDistanceContextResponse: 'Alpha particle escape distance { $distanceProgress }, half-life { $hLifeProgress }.'
  potentialEnergySlider:
    accessibleName: Potential Energy Barrier Height
    accessibleHelpText: Adjust barrier height.
  alphaParticleEnergySlider:
    accessibleName: Alpha Particle Energy
    accessibleHelpText: Adjust energy of alpha particles in nucleus.
  decayTimeHistogram:
    accessibleParagraph: '{ $scale } timeline shows when each { $isotope } atom decayed relative to the half-life, { $hLifeTime } seconds.'
    scale:
      select_scale:
        linear: Linear
        logarithmic: Logarithmic
  halfLifeSlider:
    accessibleHelpText: Adjust time for isotope A to undergo one half-life.
    accessibleContextResponse: 'Alpha particle energy { $initialEProgress }, alpha particle escape distance { $distanceProgress }.'
  dataProbeSlider:
    accessibleHelpText: Move probe horizontally to explore graph values.
  timeScaleCheckbox:
    accessibleHelpText: Show or hide time scale ranging from milliseconds to billions of years.
    accessibleContextResponseChecked: Time scale shown.
    accessibleContextResponseUnchecked: Time scale hidden.
  eraserButton:
    accessibleName: Erase Data
    accessibleContextResponse: Data points removed.
  isotopePanel:
    accessibleHelpText: Choose an isotope to explore its decay.
  particleCounts:
    accessibleName: Particle Counts
    accessibleHelpTextCollapsed: View numbers of protons and neutrons in current isotope.
    accessibleParagraph: '{ $isotope } contains { $protons } protons and { $neutrons } neutrons.'
    noData: No data to display.
  nuclearEquation:
    accessibleHelpTextCollapsed: View nuclear equation for decay.
    noEquation: No equation yet.
    beforeDecay: '{ $parentIsotope } decays to unknown products.'
    afterDecay: >-
      { $parentIsotope } decays to { $daughterIsotope } and an alpha particle.
  timeControls:
    accessibleHeading: Time Controls
  replayDecay:
    accessibleName: Replay Decay
    accessibleHelpText: Restart time just before last decay.
  speedControls:
    accessibleHelpText: For closer observations play sim on slower speed.
  multipleAtoms:
    screenSummary:
      playArea: >-
        You can add atoms to a radioactive sample and watch them decay. As time passes, you can track how much
        remains and reset the sample to repeat your experiment. A timeline shows the moment of each decay
        relative to the half-life. With a custom isotope, you can also experiment with the half-life time.
      controlArea: >-
        Checkboxes let you show or hide the electron cloud and stopwatch. You can control how fast the action
        happens including buttons to pause and step forward. Reset sim to start over.
      currentDetails:
        select_atom:
          noAtoms: Currently, there are no atoms in sample.
          withAtoms: 'Currently { $percentage } percent radioactive sample remaining.'
      interactionHint:
        addAtoms: Add atoms to begin observations.
        afterDecay: Reset sample to continue observations.
    radioactiveSampleHeading: Radioactive Sample
    radioactiveSample:
      noAtoms: 'No atoms in sample. Look for { $isotope } atoms control to get started.'
      readyToDecay: 'Original sample contains { $addedAtoms } { $isotope } atoms, ready to decay.'
      decayOccurring:
        accessibleList:
          leadingParagraph: 'Currently,'
          sampleAge: '{ $isotope } sample is { $time } seconds old and { $percentageUndecayed } percent remains.'
          undecayedCountItem: '{ $undecayedCount } { $parentIsotope } atoms.'
          decayedCountItem: '{ $decayedCount } { $daughterIsotope } atoms.'
    numberOfAtomsControl:
      accessibleName: '{ $isotope } Atoms'
    setSampleControl:
      accessibleName: Set Sample
      accessibleHelpText: Choose number of atoms for radioactive sample. Then look for set sample button.
    resetSampleButton:
      accessibleName: Reset Sample
    decayDataHeading: Decay Data
    decayTimeHistogramAtHalfLife: 'At half-life, { $halfLifePercentageUndecayed } percent of sample remains.'
    labelsCheckbox:
      accessibleName: Labels
      accessibleHelpText: Show or hide labels for atoms.
    stopwatchCheckbox:
      accessibleName: Stopwatch
      accessibleHelpText: Show or hide stopwatch.
  decayRate:
    screenSummary:
      playArea: >-
        There is a radioactive sample where you can add atoms and watch them decay. As time passes, you can
        track how much remains and reset the sample to repeat your experiment. A decay graph plots the
        percentage of sample remaining as a function of time.
      controlArea: >-
        Checkboxes let you show or hide isotope curves, half-life markers, and a data probe on the decay
        graph. You can also control how fast the action happens including buttons to pause and step forward.
        Reset sim to start over.
      currentDetails:
        select_atom:
          noAtoms: Currently, there are no atoms in sample.
          withAtoms: 'Currently { $percentage } percent radioactive sample remaining.'
      interactionHint:
        addAtoms: Add atoms to begin observations.
        afterDecay: Reset sample to continue observations.
    radioactiveSample:
      decayOccurring:
        accessibleList:
          leadingParagraph: 'Currently,'
          sampleAge: '{ $isotope } sample is { $time } seconds old and { $percentageUndecayed } percent remains.'
          undecayedCountItem: '{ $undecayedCount } { $parentIsotope } atoms.'
          decayedCountItem: '{ $decayedCount } { $daughterIsotope } atoms.'
    decayGraphHeading: Decay Graph
    decayGraphPanel:
      accessibleParagraph: 'Decay graph plots percent of isotope remaining as a function of time. Currently, { $checkedComponents } visible on graph.'
    undecayedCheckbox:
      accessibleName: '{ $isotope } Curve'
      accessibleHelpText: Show or hide decay curve.
    decayedCheckbox:
      accessibleName: '{ $isotope } Curve'
      accessibleHelpText: Show or hide formation curve.
    halfLivesCheckbox:
      accessibleName: Half-Lives
      accessibleHelpText: Explore decay graph with or without half-life markers.
    dataProbeCheckbox:
      accessibleName: Data Probe
      accessibleHelpText: Explore decay graph with or without values.
    sortButton:
      accessibleName: Sort
      accessibleHelpText: Group atoms by isotope.
    resetSampleButton:
      accessibleName: Reset Sample
  particlesLegendPanel:
    accessibleList:
      leadingParagraph: 'Particle legend shows:'
      proton: 'Proton: red sphere.'
      neutron: 'Neutron: gray sphere.'
      alphaParticle: 'Alpha Particle: cluster of 2 protons and 2 neutrons.'